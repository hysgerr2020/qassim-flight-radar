name: Qassim Flight Radar 24/7

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flight-scan:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 استرجاع ملفات المشروع
        uses: actions/checkout@v4

      - name: 🐍 تثبيت بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 تثبيت المكتبات والمتصفح السحابي
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 🚀 تشغيل محرك فحص الرحلات
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          GOOGLE_SHEET_VIEW_URL: ${{ secrets.GOOGLE_SHEET_VIEW_URL }}
        run: python flight_scanner_cloud.py

      - name: 💾 حفظ وتحديث سجل الأسعار في المستودع
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main || true
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 تحديث أرشيف الأسعار السحابي تلقائياً" && git push origin main)
