name: Qassim Flight Radar 24/7

on:
  schedule:
    # يعمل تلقائياً كل ساعتين على مدار اليوم 24/7
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flight-scan:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 استرجاع ملفات المستودع
        uses: actions/checkout@v4

      - name: 🐍 تثبيت بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 تثبيت المكتبات ومتصفح Chromium مع حزم النظام
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 🚀 تشغيل محرك الرادار السحابي
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          GOOGLE_SHEET_VIEW_URL: ${{ secrets.GOOGLE_SHEET_VIEW_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python flight_scanner_cloud.py

      - name: 💾 حفظ وتحديث سجل وتاريخ الأسعار في المستودع
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff-index --quiet HEAD || git commit -m "🔄 تحديث أرشيف وتاريخ الأسعار تلقائياً"
          git pull --rebase origin main || true
          git push origin main || true
