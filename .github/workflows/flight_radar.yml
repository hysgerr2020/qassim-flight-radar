name: Qassim Flight Radar 24/7

on:
  schedule:
    # تشغيل تلقائي دوري كل ساعتين على مدار الساعة
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      custom_dep:
        description: 'تاريخ الذهاب (YYYY-MM-DD)'
        required: false
        default: ''
      custom_ret:
        description: 'تاريخ العودة (YYYY-MM-DD)'
        required: false
        default: ''
      custom_type:
        description: 'نوع الرحلة (oneway_out, oneway_in, roundtrip)'
        required: false
        default: 'roundtrip'

concurrency:
  group: flight-radar-engine
  cancel-in-progress: false

jobs:
  scrape_and_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: فحص واستخراج الكود
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: إعداد بايثون 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: فحص ذاكرة التخزين المؤقت لمتصفح Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('**/flight_scanner_cloud.py') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: تثبيت المكتبات والمتصفح السحابي
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl matplotlib
          playwright install --with-deps chromium

      - name: تشغيل الرادار السحابي وصائد القيعان
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          GOOGLE_SHEET_VIEW_URL: ${{ secrets.GOOGLE_SHEET_VIEW_URL }}
          CUSTOM_DEP: ${{ inputs.custom_dep }}
          CUSTOM_RET: ${{ inputs.custom_ret }}
          CUSTOM_TYPE: ${{ inputs.custom_type }}
          TRAVELPAYOUTS_MARKER: "573156"
        run: python flight_scanner_cloud.py

      - name: حفظ السجلات التاريخية وتحديث بيانات التطبيق المصغر
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # ضم كافة الملفات المعدلة والجديدة دون استثناء لمنع خطأ unstaged changes نهائياً
          git add -A

          # التحقق من وجود تغييرات حقيقية
          if git diff --cached --quiet; then
            echo "لا توجد تعديلات جديدة لحفظها."
          else
            git commit -m "تحديث تلقائي: بيانات الرادار والتطبيق المصغر [skip ci]"
            
            # محاولة الدفع المباشر، وفي حال وجود تعارض تتم المزامنة النظيفة
            PUSH_SUCCESS=0
            for i in {1..5}; do
              if git push origin main; then
                echo "✅ تم دفع البيانات وتحديث التطبيق المصغر بنجاح!"
                PUSH_SUCCESS=1
                break
              fi
              echo "⚠️ تعارض أثناء الدفع ($i)، جاري المزامنة مع السيرفر..."
              git pull --rebase -X theirs origin main || {
                git rebase --abort 2>/dev/null || true
              }
              sleep 2
            done

            if [ $PUSH_SUCCESS -eq 0 ]; then
              echo "❌ فشل الدفع النهائي بعد 5 محاولات."
              exit 1
            fi
          fi
