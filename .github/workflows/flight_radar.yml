name: Qassim Flight Radar 24/7

on:
  schedule:
    # تشغيل تلقائي كل ساعتين على مدار الساعة
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      custom_dep:
        description: 'تاريخ الذهاب (YYYY-MM-DD)'
        required: false
        default: ''
      custom_ret:
        description: 'تاريخ العودة (YYYY-MM-DD)'
        required: false
        default: ''
      custom_type:
        description: 'نوع الرحلة (oneway_out, oneway_in, roundtrip)'
        required: false
        default: 'roundtrip'

jobs:
  scrape_and_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # صلاحية إلزامية لنجاح git push وتحديث ملفات المستودع

    steps:
      - name: فحص واستخراج الكود
        uses: actions/checkout@v4

      - name: إعداد بايثون 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: تثبيت المكتبات والمتصفح السحابي
        run: |
          pip install --upgrade pip
          pip install playwright pandas openpyxl matplotlib
          playwright install --with-deps chromium

      - name: تشغيل الرادار السحابي وصائد القيعان
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          GOOGLE_SHEET_VIEW_URL: ${{ secrets.GOOGLE_SHEET_VIEW_URL }}
          CUSTOM_DEP: ${{ inputs.custom_dep }}
          CUSTOM_RET: ${{ inputs.custom_ret }}
          CUSTOM_TYPE: ${{ inputs.custom_type || 'roundtrip' }}
        run: python flight_scanner_cloud.py

      - name: حفظ السجلات التاريخية في المستودع وتحديث بيانات الويب
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add flight_price_history.json google_flights_weekends.xlsx flights_data.json || true
          git commit -m "تحديث تلقائي: بيانات الرادار والتطبيق المصغر [skip ci]" || echo "لا توجد تعديلات لحفظها"
          git pull --rebase origin main || true
          git push || echo "فشل دفع التعديلات"
