name: Qassim Flight Radar 24/7

on:
  schedule:
    # تشغيل تلقائي دوري كل ساعتين على مدار الساعة
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      custom_dep:
        description: 'تاريخ الذهاب (YYYY-MM-DD)'
        required: false
        default: ''
      custom_ret:
        description: 'تاريخ العودة (YYYY-MM-DD)'
        required: false
        default: ''
      custom_type:
        description: 'نوع الرحلة (oneway_out, oneway_in, roundtrip)'
        required: false
        default: 'roundtrip'

# قفل التزامن لمنع تصادم الفحص التلقائي مع طلبات التيليجرام الفورية
concurrency:
  group: flight-radar-engine
  cancel-in-progress: false

jobs:
  scrape_and_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: فحص واستخراج الكود
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: إعداد بايثون 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: فحص ذاكرة التخزين المؤقت لمتصفح Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('**/flight_scanner_cloud.py') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: تثبيت المكتبات والمتصفح السحابي
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl matplotlib
          # تثبيت المتصفح السحابي ومكتبات النظام مع تفادي التنزيل المكرر
          playwright install --with-deps chromium

      - name: تشغيل الرادار السحابي وصائد القيعان
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          GOOGLE_SHEET_VIEW_URL: ${{ secrets.GOOGLE_SHEET_VIEW_URL }}
          CUSTOM_DEP: ${{ inputs.custom_dep }}
          CUSTOM_RET: ${{ inputs.custom_ret }}
          CUSTOM_TYPE: ${{ inputs.custom_type }}
          TRAVELPAYOUTS_MARKER: "573156"
        run: python flight_scanner_cloud.py

      - name: حفظ السجلات التاريخية وتحديث بيانات التطبيق المصغر
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # إضافة الملفات المحدثة فقط في حال وجودها
          for file in flight_price_history.json google_flights_weekends.xlsx flights_data.json; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          # التحقق من وجود تغييرات حقيقية قبل إنشاء الـ Commit
          if git diff --staged --quiet; then
            echo "لا توجد تعديلات جديدة لحفظها."
          else
            git commit -m "تحديث تلقائي: بيانات الرادار والتطبيق المصغر [skip ci]"
            
            # حلقة إعادة محاولة محصنة تعتمد أحدث البيانات المحلية (-X theirs)
            PUSH_SUCCESS=0
            for i in {1..5}; do
              git fetch origin main
              if git rebase -X theirs origin/main; then
                if git push origin main; then
                  echo "✅ تم دفع التعديلات بنجاح إلى المستودع."
                  PUSH_SUCCESS=1
                  break
                fi
              fi
              echo "⚠️ محاولة دفع غير مكتملة ($i)، إعادة المزامنة..."
              git rebase --abort 2>/dev/null || true
              sleep $((i * 2))
            done
            
            if [ $PUSH_SUCCESS -eq 0 ]; then
              echo "❌ تعذر إتمام الدفع بعد 5 محاولات متتالية."
              exit 1
            fi
          fi
