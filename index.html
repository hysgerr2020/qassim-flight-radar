<body class="bg-slate-900 text-slate-100 min-h-screen select-none">

  <!-- Header Section -->
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3">

        </div>

          <h1 class="text-base font-extrabold text-white leading-tight">رادار طيران القصيم ⇄ جدة</h1>

        </div>

  <main class="px-4 py-4 space-y-4 max-w-lg mx-auto">

    <!-- Overview Stat Cards -->
    <div class="grid grid-cols-3 gap-2.5">
      <div class="bg-slate-800/70 border border-slate-700/60 rounded-2xl p-3">
        <span class="text-[11px] text-slate-400 block mb-1">أرخص سعر</span>
        <div class="flex items-baseline space-x-1 space-x-reverse">
          <span id="statLowestPrice" class="text-xl font-black text-emerald-400">--</span>
          <span class="text-[10px] text-emerald-400/80">ر.س</span>
        </div>
        <span id="statLowestAirline" class="text-[10px] text-slate-400 truncate block mt-0.5">--</span>
      </div>

      <div class="bg-slate-800/70 border border-slate-700/60 rounded-2xl p-3">
        <span class="text-[11px] text-slate-400 block mb-1">متوسط السوق</span>
        <div class="flex items-baseline space-x-1 space-x-reverse">
          <span id="statAvgPrice" class="text-xl font-black text-indigo-400">--</span>
          <span class="text-[10px] text-indigo-400/80">ر.س</span>
        </div>
        <span class="text-[10px] text-slate-400 truncate block mt-0.5">مؤشر مرجعي</span>
      </div>

      <div class="bg-slate-800/70 border border-slate-700/60 rounded-2xl p-3">
        <span class="text-[11px] text-slate-400 block mb-1">أعلى ثقة شراء</span>
        <div id="statDecisionBadge" class="text-sm font-black text-slate-200 mt-0.5">
          --
        </div>
        <span id="statDecisionSub" class="text-[10px] text-slate-400 truncate block mt-0.5">القرار الآلي</span>
      </div>
    </div>

    <!-- Live Multi-Passenger & Baggage Calculator Widget -->
    <section class="bg-slate-800/80 border border-slate-700/70 rounded-2xl p-4 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-white flex items-center gap-1.5">
          <span>👨‍👩‍👧‍👦</span>
          <span>حاسبة الركاب والأمتعة التفاعلية</span>
        </h2>
        <span class="text-xs font-bold text-indigo-400 bg-indigo-950/60 px-2 py-0.5 rounded-full border border-indigo-800/60">
          تحديث لحظي
        </span>
      </div>

      <div class="grid grid-cols-2 gap-3 pt-1">
        <div class="space-y-1">
          <div class="flex justify-between text-xs">
            <span class="text-slate-400">المسافرين:</span>
            <span id="paxValue" class="font-bold text-white">1</span>
          </div>
          <input id="paxSlider" type="range" min="1" max="6" value="1" 
                 class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500"
                 oninput="handleSliderChange()">
        </div>

        <div class="space-y-1">
          <div class="flex justify-between text-xs">
            <span class="text-slate-400">حقائب الشحن (20kg):</span>
            <span id="bagValue" class="font-bold text-white">0</span>
          </div>
          <input id="bagSlider" type="range" min="0" max="4" value="0" 
                 class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500"
                 oninput="handleSliderChange()">
        </div>
      </div>
    </section>

    <!-- Filters Carousel -->
    <div class="flex space-x-2 space-x-reverse overflow-x-auto no-scrollbar py-1">
      <button onclick="setFilter('all')" id="filter-all" class="filter-btn px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-indigo-600 text-white border border-indigo-500 shadow-sm transition">
        الكل
      </button>
      <button onclick="setFilter('deals')" id="filter-deals" class="filter-btn px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-800 text-slate-300 border border-slate-700 transition">
        🔥 قيعان وصفقات (≤ 390)
      </button>
      <button onclick="setFilter('high_confidence')" id="filter-high_confidence" class="filter-btn px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-800 text-slate-300 border border-slate-700 transition">
        🎯 صفقات مؤكدة (85%+)
      </button>
      <button onclick="setFilter('adeal')" id="filter-adeal" class="filter-btn px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-800 text-slate-300 border border-slate-700 transition">
        🟢 أديل
      </button>
      <button onclick="setFilter('saudia')" id="filter-saudia" class="filter-btn px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-800 text-slate-300 border border-slate-700 transition">
        🇸🇦 السعودية
      </button>
      <button onclick="setFilter('nas')" id="filter-nas" class="filter-btn px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap bg-slate-800 text-slate-300 border border-slate-700 transition">
        🟡 ناس
      </button>
    </div>

    <!-- Flight Cards Container -->
    <div id="flightsList" class="space-y-3">
      <div class="bg-slate-800/50 border border-slate-700/40 rounded-2xl p-6 text-center text-slate-400">
        جاري تحميل وتجهيز مسارات الأسعار...
      </div>
    </div>

  </main>

  <script>
    const tg = (typeof window !== 'undefined' && window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
        if (typeof tg.isVersionAtLeast === 'function' && tg.isVersionAtLeast('6.1')) {
          if (tg.setHeaderColor) tg.setHeaderColor('#0f172a');
          if (tg.setBackgroundColor) tg.setBackgroundColor('#0f172a');
        }
        if (typeof tg.enableClosingConfirmation === 'function') {
          tg.enableClosingConfirmation();
        }
      } catch (e) {
        console.warn("Telegram WebApp initialization notice:", e);
      }
    }

    const TRAVELPAYOUTS_MARKER = "573156";
    const AR_NUM_MAP = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
    let rawFlights = [];
    let marketStats = { avg_price: 0, min_price: 0, total: 0 };
    let activeFilter = 'all';
    let isInitialLoading = true;
    let renderRafId = null;

    function triggerHaptic(type = 'light') {
      try {
        if (tg && tg.HapticFeedback && typeof tg.HapticFeedback.impactOccurred === 'function') {
          tg.HapticFeedback.impactOccurred(type);
        }
      } catch (e) {}
    }

    function triggerRefresh() {
      triggerHaptic('medium');
      const icon = document.getElementById('refreshIcon');
      if (icon) icon.classList.add('animate-spin-custom');
      fetchLatestData(true).finally(() => {
        if (icon) icon.classList.remove('animate-spin-custom');
      });
    }

    function handleSliderChange() {
      triggerHaptic('selection_changed');
      if (renderRafId) cancelAnimationFrame(renderRafId);
      renderRafId = requestAnimationFrame(() => {
        if (!isInitialLoading) renderFlights();
      });
    }

    function openBookingUrl(url) {
      triggerHaptic('light');
      if (!url) return;
      try {
        if (tg && typeof tg.openLink === 'function') {
          tg.openLink(url, { try_instant_view: false });
        } else {
          window.open(url, '_blank', 'noopener,noreferrer');
        }
      } catch (e) {
        window.open(url, '_blank', 'noopener,noreferrer');
      }
    }

    function escapeHtml(text) {
      if (text === null || text === undefined) return "";
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function parsePrice(val) {
      if (typeof val === 'number') return isNaN(val) ? 0 : Math.round(val);
      if (!val) return 0;
      let s = String(val).replace(/[٠-٩]/g, w => AR_NUM_MAP[w] || w).replace(/,/g, '').trim();
      let n = parseFloat(s);
      return isNaN(n) ? 0 : Math.round(n);
    }

    function cleanDate(d) {
      if (!d) return "";
      let s = String(d).replace(/[٠-٩]/g, w => AR_NUM_MAP[w] || w);
      const m = s.match(/\b\d{4}[-/]\d{2}[-/]\d{2}\b/);
      return m ? m[0].replace(/\//g, '-') : "";
    }

    function getKsaTodayString() {
      try {
        const formatter = new Intl.DateTimeFormat('en-CA', { 
          timeZone: 'Asia/Riyadh', 
          year: 'numeric', 
          month: '2-digit', 
          day: '2-digit' 
        });
        return formatter.format(new Date());
      } catch (e) {
        return new Date().toISOString().slice(0, 10);
      }
    }

    function addDays(dateStr, days) {
      try {
        const parts = dateStr.split('-');
        if (parts.length === 3) {
          const d = new Date(Date.UTC(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10)));
          d.setUTCDate(d.getUTCDate() + days);
          const y = d.getUTCFullYear();
          const m = String(d.getUTCMonth() + 1).padStart(2, '0');
          const day = String(d.getUTCDate()).padStart(2, '0');
          return `${y}-${m}-${day}`;
        }
      } catch (e) {}
      return dateStr;
    }

    function getAirlineShortName(airline) {
      const air = String(airline || "");
      if (air.includes("دمج ذكي")) return "دمج ذكي";
      if (air.includes("أديل") || air.toLowerCase().includes("flyadeal")) return "أديل";
      if (air.includes("ناس") || air.toLowerCase().includes("flynas")) return "ناس";
      if (air.includes("السعودية") || air.toLowerCase().includes("saudia")) return "السعودية";
      return air.split(' ')[0] || "الشركة";
    }

    function calculateBaggageFee(airline, isOneWay, bags) {
      if (bags <= 0) return 0;
      const air = String(airline || "");
      const factor = isOneWay ? 0.5 : 1.0;

      if (air.includes("دمج ذكي")) {
        if (air.includes("السعودية") && (air.includes("أديل") || air.includes("ناس"))) {
          return Math.round(75 * factor * bags);
        } else if (air.includes("ناس")) {
          return Math.round(150 * factor * bags);
        }
        return Math.round(140 * factor * bags);
      }

      const airLower = air.toLowerCase();
      if (air.includes("السعودية") || airLower.includes("saudia")) {
        return 0;
      } else if (air.includes("ناس") || airLower.includes("flynas")) {
        return Math.round(150 * factor * bags);
      }
      return Math.round(140 * factor * bags);
    }

    function buildDirectAirlineUrl(airline, dep, ret, tripType) {
      const air = airline || "";
      const depC = cleanDate(dep);
      const retC = cleanDate(ret);
      const isRound = Boolean(retC);
      const ttParam = isRound ? "RoundTrip" : "OneWay";
      const retParam = isRound ? `&returnDate=${retC}` : "";

      const isOneWayIn = String(tripType || "").includes("جدة ⬅ القصيم") || String(tripType || "").includes("عودة فقط");
      const origin = isOneWayIn ? "JED" : "ELQ";
      const destination = isOneWayIn ? "ELQ" : "JED";

      if (air.includes("دمج ذكي")) {
        return `https://www.google.com/travel/flights?q=Flights%20from%20${origin}%20to%20${destination}%20on%20${depC}${isRound ? '%20through%20' + retC : ''}%20nonstop&curr=SAR&hl=ar&gl=sa`;
      }

      if (air.includes("أديل") || air.toLowerCase().includes("flyadeal")) {
        return `https://www.flyadeal.com/ar/search-flight?origin=${origin}&destination=${destination}&departureDate=${depC}${retParam}&adults=1&tripType=${ttParam}`;
      } else if (air.includes("ناس") || air.toLowerCase().includes("flynas")) {
        return `https://www.flynas.com/ar/booking/flight-search?origin=${origin}&destination=${destination}&departureDate=${depC}${retParam}&adults=1&tripType=${ttParam}`;
      } else if (air.includes("السعودية") || air.toLowerCase().includes("saudia")) {
        return `https://www.saudia.com/ar/booking?origin=${origin}&destination=${destination}&departureDate=${depC}${retParam}&adults=1&tripType=${ttParam}`;
      }
      return `https://www.google.com/travel/flights?q=Flights%20from%20${origin}%20to%20${destination}%20on%20${depC}${isRound ? '%20through%20' + retC : ''}%20nonstop&curr=SAR&hl=ar&gl=sa`;
    }

    function buildHotelUrl(dep, ret) {
      const checkIn = cleanDate(dep) || getKsaTodayString();
      let checkOut = cleanDate(ret);
      if (!checkOut || checkOut <= checkIn) {
        checkOut = addDays(checkIn, 1);
      }
      return `https://search.hotellook.com/?destination=Jeddah&checkIn=${checkIn}&checkOut=${checkOut}&marker=${TRAVELPAYOUTS_MARKER}&language=ar&currency=SAR`;
    }

    function loadCachedData() {
      try {
        const cached = localStorage.getItem('qassim_radar_cache');
        if (cached) {
          const parsed = JSON.parse(cached);
          if (parsed && Array.isArray(parsed.flights) && parsed.flights.length > 0) {
            processData(parsed, true);
          }
        }
      } catch (e) {
        console.warn("فشل قراءة الذاكرة المؤقتة:", e);
      }
    }

    function processData(data, isFromCache = false) {
      marketStats = data.stats || { avg_price: 0, min_price: 0, total: 0 };
      rawFlights = [];

      rawFlights = (data.flights || []).map(item => {
        const price = parsePrice(item["السعر"] || item.price);
        let score = parsePrice(item["مؤشر_الثقة"] || item.score);
        let rec = item["توصية_القرار"] || item.recommendation || "راقب السعر";
        let forecast = item["توقعات_7_أيام"] || item.forecast || "السعر ضمن النطاق الطبيعي.";
        let level = item["مستوى_الثقة"] || item.level || "medium";

        if (!score || score <= 0) {
          if (price <= 358) {
            score = 96; rec = "احجز فوراً (قاع تاريخي)";
            forecast = "السعر في القاع الترويجي الأدنى."; level = "high";
          } else if (price <= 420) {
            score = 87; rec = "سعر اقتصادي ممتاز";
            forecast = "سعر مناسب جداً داخل نافذة الشراء الآمنة."; level = "high";
          } else if (price <= 550) {
            score = 65; rec = "سعر متوسط";
            forecast = "إمكانية طرح مقاعد مخفضة لاحقاً."; level = "medium";
          } else {
            score = 30; rec = "سعر متضخم";
            forecast = "المقاعد الاقتصادية غير متوفرة حالياً."; level = "low";
          }
        }

        const depVal = item["تاريخ الذهاب"] || item.dep || "";
        const timeVal = item["وقت الإقلاع"] || item.time || item.time_ar || "";
        const retVal = item["تاريخ العودة"] || item.ret || "";
        const airlineVal = item["الناقل"] || item.airline || "رحلة مباشرة";
        const tripTypeVal = item["نوع العطلة"] || item.trip_type || "رحلة مباشرة";

        return {
          trip_type: tripTypeVal,
          dep: depVal,
          time: timeVal,
          ret: retVal,
          airline: airlineVal,
          price: price,
          link: item["الرابط"] || item.link || buildDirectAirlineUrl(airlineVal, depVal, retVal, tripTypeVal),
          score: score,
          recommendation: rec,
          forecast: forecast,
          level: level
        };
      });

      const updateLabel = document.getElementById('lastUpdateText');
      if (isFromCache) {
        updateLabel.innerText = "بيانات محفوظة: " + (data.updated_at || "مسبقاً");
      } else {
        updateLabel.innerText = "آخر فحص حي: " + (data.updated_at || "الآن");
        try {
          localStorage.setItem('qassim_radar_cache', JSON.stringify(data));
        } catch(e) {}
      }

      isInitialLoading = false;
      updateStats();
      renderFlights();
    }

    async function fetchLatestData(forceRefresh = false) {
      try {
        const res = await fetch('./flights_data.json?v=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error("تعذر جلب البيانات السحابية");
        const data = await res.json();
        processData(data, false);
      } catch (err) {
        console.error("خطأ في جلب البيانات:", err);
        const updateLabel = document.getElementById('lastUpdateText');
        if (rawFlights.length === 0) {
          updateLabel.innerText = "⚠️ تعذر قراءة البيانات السحابية";
          const container = document.getElementById('flightsList');
          if (container) {
            container.innerHTML = `
              <div class="bg-slate-800/40 border border-rose-900/40 rounded-2xl p-6 text-center text-slate-400 space-y-2">
                <div class="text-rose-400 font-bold">⚠️ تعذر مزامنة الرحلات الحية</div>
                <div class="text-xs">تأكد من اتصالك بالإنترنت أو أعد المحاولة لاحقاً.</div>
              </div>`;
          }
        } else {
          updateLabel.innerText += " (وضع عدم الاتصال ⚠️)";
        }
      } finally {
        isInitialLoading = false;
      }
    }

    function updateStats() {
      const validFlights = rawFlights.filter(f => f.price > 0);
      if (validFlights.length === 0) return;
      const sortedByPrice = [...validFlights].sort((a, b) => a.price - b.price);
      const lowest = sortedByPrice[0];

      document.getElementById('statLowestPrice').innerText = lowest.price;
      document.getElementById('statLowestAirline').innerText = getAirlineShortName(lowest.airline);

      const avg = marketStats.avg_price || Math.round(validFlights.reduce((acc, cur) => acc + cur.price, 0) / validFlights.length);
      document.getElementById('statAvgPrice').innerText = avg;

      const highestScoreItem = [...validFlights].sort((a, b) => b.score - a.score)[0];
      const badgeEl = document.getElementById('statDecisionBadge');
      const subEl = document.getElementById('statDecisionSub');

      const scoreColor = highestScoreItem.score >= 85 ? 'text-emerald-400' : (highestScoreItem.score >= 60 ? 'text-amber-400' : 'text-rose-400');
      badgeEl.innerHTML = `<span class="${scoreColor} font-bold">${highestScoreItem.score}%</span>`;
      subEl.innerText = `${highestScoreItem.recommendation}`;
    }

    function setFilter(type) {
      triggerHaptic('selection_changed');
      activeFilter = type;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-500');
        b.classList.add('bg-slate-800', 'text-slate-300', 'border-slate-700');
      });
      const activeBtn = document.getElementById('filter-' + type);
      if (activeBtn) {
        activeBtn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-500');
        activeBtn.classList.remove('bg-slate-800', 'text-slate-300', 'border-slate-700');
      }
      if (!isInitialLoading) {
        renderFlights();
      }
    }

    function renderFlights() {
      const container = document.getElementById('flightsList');
      if (!container) return;
      container.innerHTML = "";

      if (isInitialLoading && rawFlights.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-800/50 border border-slate-700/40 rounded-2xl p-6 text-center text-slate-400">
            جاري تحميل وتجهيز مسارات الأسعار...
          </div>`;
        return;
      }

      const pax = parseInt(document.getElementById('paxSlider').value, 10) || 1;
      const bags = parseInt(document.getElementById('bagSlider').value, 10) || 0;
      document.getElementById('paxValue').innerText = pax;
      document.getElementById('bagValue').innerText = bags;

      let filtered = [...rawFlights];

      if (activeFilter === 'deals') {
        filtered = filtered.filter(x => x.price <= 390 && x.price > 0);
      } else if (activeFilter === 'high_confidence') {
        filtered = filtered.filter(x => x.score >= 85);
      } else if (activeFilter === 'adeal') {
        filtered = filtered.filter(x => x.airline.includes("أديل"));
      } else if (activeFilter === 'saudia') {
        filtered = filtered.filter(x => x.airline.includes("السعودية"));
      } else if (activeFilter === 'nas') {
        filtered = filtered.filter(x => x.airline.includes("ناس"));
      }

      filtered.sort((a, b) => a.price - b.price);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-6 text-center text-slate-400">
            ℹ️ لا توجد رحلات مطابقة للفلاتر الحالية.
          </div>`;
        return;
      }

      const marketAvg = marketStats.avg_price || 420;
      const fragment = document.createDocumentFragment();

      filtered.forEach(item => {
        const isOneWay = !item.ret || item.ret.trim() === "";
        const bagFee = calculateBaggageFee(item.airline, isOneWay, bags);
        const finalPrice = Math.round((item.price * pax) + bagFee);

        let barColor = "bg-rose-500";
        let badgeBg = "bg-rose-950 text-rose-300 border-rose-800/60";
        if (item.score >= 85) {
          barColor = "bg-emerald-500";
          badgeBg = "bg-emerald-950 text-emerald-300 border-emerald-800/60";
        } else if (item.score >= 60) {
          barColor = "bg-amber-500";
          badgeBg = "bg-amber-950 text-amber-300 border-amber-800/60";
        }

        let airlineColor = "bg-indigo-950 text-indigo-400 border-indigo-800/60";
        if (item.airline.includes("أديل")) airlineColor = "bg-emerald-950 text-emerald-400 border-emerald-800/60";
        if (item.airline.includes("ناس")) airlineColor = "bg-amber-950 text-amber-400 border-amber-800/60";
        if (item.airline.includes("السعودية")) airlineColor = "bg-blue-950 text-blue-300 border-blue-800/60";
        if (item.airline.includes("دمج ذكي")) airlineColor = "bg-purple-950 text-purple-300 border-purple-800/60";

        let timeDisplay = "";
        if (item.time && !item.dep.includes(item.time)) {
          timeDisplay = `(${escapeHtml(item.time)})`;
        }

        const returnHtml = isOneWay ? 
          `<div class="text-xs text-indigo-400 font-bold mt-0.5">🛫 اتجاه واحد فقط</div>` : 
          `<div class="text-xs text-slate-400 mt-0.5">عودة: <code>${escapeHtml(cleanDate(item.ret))}</code></div>`;

        let savingBadge = "";
        if (item.price < marketAvg && marketAvg > 0 && item.price > 0) {
          const discountPct = Math.min(95, Math.max(1, Math.round(((marketAvg - item.price) / marketAvg) * 100)));
          if (discountPct >= 10) {
            savingBadge = `<span class="text-[10px] font-extrabold text-emerald-400 bg-emerald-950/80 px-1.5 py-0.5 rounded border border-emerald-700/60">وفر ${discountPct}%</span>`;
          }
        }

        const directLink = buildDirectAirlineUrl(item.airline, item.dep, item.ret, item.trip_type);
        const hotelLink = buildHotelUrl(item.dep, item.ret);
        const shortName = getAirlineShortName(item.airline);

        const card = document.createElement('div');
        card.className = "bg-slate-800/70 border border-slate-700/70 rounded-2xl p-4 shadow-lg space-y-3";

        card.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-700/50 pb-2.5">
            <div class="flex items-center gap-1.5">
              <span class="px-2.5 py-0.5 rounded-lg text-xs font-bold border ${airlineColor}">
                ✈️ ${escapeHtml(item.airline)}
              </span>
              ${savingBadge}
            </div>
            <span class="text-xs text-slate-400 font-medium">${escapeHtml(item.trip_type)}</span>
          </div>

          <div class="flex items-center justify-between">
            <div>
              <div class="text-xs text-slate-400">مواعيد السفر</div>
              <div class="text-sm font-bold text-white mt-0.5">
                ذهاب: <code>${escapeHtml(cleanDate(item.dep))}</code> ${timeDisplay}
              </div>
              ${returnHtml}
            </div>

            <div class="text-left">
              <span class="text-xs text-slate-400 block">${pax > 1 || bags > 0 ? 'التكلفة الإجمالية' : 'السعر'}</span>
              <span class="text-2xl font-black text-white">${finalPrice}</span>
              <span class="text-xs text-slate-300">ر.س</span>
            </div>
          </div>

          <!-- شريط الثقة والتنبؤ الاحتمالي -->
          <div class="bg-slate-900/60 border border-slate-700/50 rounded-xl p-2.5 space-y-2">
            <div class="flex items-center justify-between text-xs">
              <span class="text-slate-400 flex items-center gap-1">
                <span>🎯 مؤشر الشراء:</span>
                <b class="text-white">${item.score}%</b>
              </span>
              <span class="px-2 py-0.5 rounded-md text-[11px] font-bold border ${badgeBg}">
                ${escapeHtml(item.recommendation)}
              </span>
            </div>
            <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
              <div class="${barColor} h-1.5 rounded-full transition-all duration-500" style="width: ${item.score}%"></div>
            </div>
            <p class="text-[11px] text-slate-400 leading-snug">
              🔮 <b>توقع المسار:</b> ${escapeHtml(item.forecast)}
            </p>
          </div>

          <!-- أزرار الإجراءات التفاعلية المرتبطة برمجياً -->
          <div class="grid grid-cols-2 gap-2 pt-0.5">
            <button class="btn-direct-booking flex items-center justify-center gap-1 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-xs font-bold py-2.5 rounded-xl transition shadow-md">
              <span>حجز مباشر (${escapeHtml(shortName)})</span>
              <span>↗</span>
            </button>
            <button class="btn-hotel-booking flex items-center justify-center gap-1 bg-slate-700 hover:bg-slate-600 active:scale-95 text-slate-200 text-xs font-bold py-2.5 rounded-xl border border-slate-600 transition">
              <span>🏨 فنادق جدة</span>
              <span>↗</span>
            </button>
          </div>
        `;

        const directBtn = card.querySelector('.btn-direct-booking');
        if (directBtn) {
          directBtn.addEventListener('click', () => openBookingUrl(directLink));
        }

        const hotelBtn = card.querySelector('.btn-hotel-booking');
        if (hotelBtn) {
          hotelBtn.addEventListener('click', () => openBookingUrl(hotelLink));
        }

        fragment.appendChild(card);
      });

      container.appendChild(fragment);
    }

    // بدء التشغيل: استعراض الكاش فوراً ثم المزامنة الحية في الخلفية
    loadCachedData();
    fetchLatestData();
  </script>
</body>
</html>
