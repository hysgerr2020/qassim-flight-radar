  <script>
    const tg = (typeof window !== 'undefined' && window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
        if (typeof tg.isVersionAtLeast === 'function' && tg.isVersionAtLeast('6.1')) {
          if (tg.setHeaderColor) tg.setHeaderColor('#0f172a');
          if (tg.setBackgroundColor) tg.setBackgroundColor('#0f172a');
        }
        if (typeof tg.enableClosingConfirmation === 'function') {
          tg.enableClosingConfirmation();
        }
      } catch (e) {
        console.warn("Telegram WebApp notice:", e);
      }
    }

    const TRAVELPAYOUTS_MARKER = "573156";
    const AR_NUM_MAP = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
    let rawFlights = [];
    let marketStats = { avg_price: 0, min_price: 0, total: 0 };
    let activeFilter = 'all';
    let isInitialLoading = true;
    let renderRafId = null;
    let isOpeningUrl = false;

    // توحيد النصوص العربية ومعايرتها لحظر أي خطأ في مطابقة الهمزات والتاء المربوطة
    function normalizeArabic(str) {
      if (!str) return "";
      return String(str)
        .replace(/[أإآ]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/ى/g, 'ي')
        .toLowerCase()
        .trim();
    }

    function triggerHaptic(type = 'light') {
      try {
        if (tg && tg.HapticFeedback && typeof tg.HapticFeedback.impactOccurred === 'function') {
          tg.HapticFeedback.impactOccurred(type);
        }
      } catch (e) {}
    }

    function triggerRefresh() {
      triggerHaptic('medium');
      const icon = document.getElementById('refreshIcon');
      if (icon) icon.classList.add('animate-spin-custom');
      fetchLatestData(true).finally(() => {
        if (icon) icon.classList.remove('animate-spin-custom');
      });
    }

    function handleSliderChange() {
      triggerHaptic('selection_changed');
      const paxInput = document.getElementById('paxSlider');
      const bagInput = document.getElementById('bagSlider');
      const pax = paxInput ? (parseInt(paxInput.value, 10) || 1) : 1;
      const bags = bagInput ? (parseInt(bagInput.value, 10) || 0) : 0;
      
      const paxValEl = document.getElementById('paxValue');
      const bagValEl = document.getElementById('bagValue');
      if (paxValEl) paxValEl.innerText = pax;
      if (bagValEl) bagValEl.innerText = bags;

      saveUserPreferences(pax, bags);

      if (renderRafId) cancelAnimationFrame(renderRafId);
      renderRafId = requestAnimationFrame(() => {
        if (!isInitialLoading) renderFlights();
      });
    }

    function openBookingUrl(url) {
      if (!url || isOpeningUrl) return;
      // التحقق الصارم من البروتوكول لمنع ثغرات الحقن
      if (!/^https?:\/\//i.test(url)) {
        console.warn("Blocked invalid protocol URL:", url);
        return;
      }

      isOpeningUrl = true;
      setTimeout(() => { isOpeningUrl = false; }, 800);

      triggerHaptic('light');
      try {
        if (tg && typeof tg.openLink === 'function') {
          tg.openLink(url, { try_instant_view: false });
        } else {
          window.open(url, '_blank', 'noopener,noreferrer');
        }
      } catch (e) {
        window.open(url, '_blank', 'noopener,noreferrer');
      }
    }

    function escapeHtml(text) {
      if (text === null || text === undefined) return "";
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // استخراج الأرقام بمرونة كاملة حتى لو كانت مسبوقة بـ "SAR" أو "ر.س"
    function parsePrice(val) {
      if (typeof val === 'number') return isNaN(val) ? 0 : Math.round(val);
      if (!val) return 0;
      let s = String(val).replace(/[٠-٩]/g, w => AR_NUM_MAP[w] || w).replace(/,/g, '').trim();
      const match = s.match(/\d+(?:\.\d+)?/);
      if (!match) return 0;
      let n = parseFloat(match[0]);
      return isNaN(n) ? 0 : Math.round(n);
    }

    function cleanDate(d) {
      if (!d) return "";
      if (d instanceof Date && !isNaN(d.getTime())) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }
      let s = String(d).replace(/[٠-٩]/g, w => AR_NUM_MAP[w] || w);
      // دعم YYYY-MM-DD
      const m = s.match(/\b\d{4}[-/]\d{2}[-/]\d{2}\b/);
      if (m) return m[0].replace(/\//g, '-');
      // دعم صيغة DD-MM-YYYY إذا وردت
      const mRev = s.match(/\b(\d{2})[-/](\d{2})[-/](\d{4})\b/);
      if (mRev) return `${mRev[3]}-${mRev[2]}-${mRev[1]}`;
      return "";
    }

    function getKsaTodayString() {
      try {
        const formatter = new Intl.DateTimeFormat('en-CA', { 
          timeZone: 'Asia/Riyadh', 
          year: 'numeric', 
          month: '2-digit', 
          day: '2-digit' 
        });
        return cleanDate(formatter.format(new Date())) || new Date().toISOString().slice(0, 10);
      } catch (e) {
        return new Date().toISOString().slice(0, 10);
      }
    }

    function addDays(dateStr, days) {
      try {
        const parts = dateStr.split('-');
        if (parts.length === 3) {
          const d = new Date(Date.UTC(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10)));
          d.setUTCDate(d.getUTCDate() + days);
          const y = d.getUTCFullYear();
          const m = String(d.getUTCMonth() + 1).padStart(2, '0');
          const day = String(d.getUTCDate()).padStart(2, '0');
          return `${y}-${m}-${day}`;
        }
      } catch (e) {}
      return dateStr;
    }

    function getAirlineShortName(airline) {
      const norm = normalizeArabic(airline);
      if (norm.includes("دمج ذكي")) return "دمج ذكي";
      if (norm.includes("اديل") || norm.includes("flyadeal")) return "أديل";
      if (norm.includes("ناس") || norm.includes("flynas")) return "ناس";
      if (norm.includes("السعوديه") || norm.includes("saudia")) return "السعودية";
      return String(airline || "").split(' ')[0] || "الشركة";
    }

    function calculateBaggageFee(airline, isOneWay, bags) {
      if (bags <= 0) return 0;
      const norm = normalizeArabic(airline);
      const factor = isOneWay ? 0.5 : 1.0;

      if (norm.includes("دمج ذكي")) {
        if (norm.includes("السعوديه") && (norm.includes("اديل") || norm.includes("ناس"))) {
          return Math.round(75 * factor * bags);
        } else if (norm.includes("ناس")) {
          return Math.round(150 * factor * bags);
        }
        return Math.round(140 * factor * bags);
      }

      if (norm.includes("السعوديه") || norm.includes("saudia")) {
        return 0;
      } else if (norm.includes("ناس") || norm.includes("flynas")) {
        return Math.round(150 * factor * bags);
      }
      return Math.round(140 * factor * bags);
    }

    function buildDirectAirlineUrl(airline, dep, ret, tripType) {
      const normAir = normalizeArabic(airline);
      const depC = cleanDate(dep) || getKsaTodayString();
      const retC = cleanDate(ret);
      const isRound = Boolean(retC && retC >= depC);
      const ttParam = isRound ? "RoundTrip" : "OneWay";
      const retParam = isRound ? `&returnDate=${retC}` : "";

      const normType = normalizeArabic(tripType);
      const isOneWayIn = normType.includes("جده ⬅ القصيم") || normType.includes("عوده فقط") || normType.includes("oneway_in");
      const origin = isOneWayIn ? "JED" : "ELQ";
      const destination = isOneWayIn ? "ELQ" : "JED";

      if (normAir.includes("دمج ذكي")) {
        return `https://www.google.com/travel/flights?q=Flights%20from%20${origin}%20to%20${destination}%20on%20${depC}${isRound ? '%20through%20' + retC : ''}%20nonstop&curr=SAR&hl=ar&gl=sa`;
      }

      if (normAir.includes("اديل") || normAir.includes("flyadeal")) {
        return `https://www.flyadeal.com/ar/search-flight?origin=${origin}&destination=${destination}&departureDate=${depC}${retParam}&adults=1&tripType=${ttParam}`;
      } else if (normAir.includes("ناس") || normAir.includes("flynas")) {
        return `https://www.flynas.com/ar/booking/flight-search?origin=${origin}&destination=${destination}&departureDate=${depC}${retParam}&adults=1&tripType=${ttParam}`;
      } else if (normAir.includes("السعوديه") || normAir.includes("saudia")) {
        return `https://www.saudia.com/ar/booking?origin=${origin}&destination=${destination}&departureDate=${depC}${retParam}&adults=1&tripType=${ttParam}`;
      }
      return `https://www.google.com/travel/flights?q=Flights%20from%20${origin}%20to%20${destination}%20on%20${depC}${isRound ? '%20through%20' + retC : ''}%20nonstop&curr=SAR&hl=ar&gl=sa`;
    }

    // توجيه الفنادق بذكاء حسب اتجاه الرحلة (جدة أم القصيم)
    function buildHotelInfo(dep, ret, tripType) {
      const todayKsa = getKsaTodayString();
      let checkIn = cleanDate(dep) || todayKsa;
      if (checkIn < todayKsa) checkIn = todayKsa;

      let checkOut = cleanDate(ret);
      if (!checkOut || checkOut <= checkIn) {
        checkOut = addDays(checkIn, 1);
      }

      const normType = normalizeArabic(tripType);
      const isOneWayIn = normType.includes("جده ⬅ القصيم") || normType.includes("عوده فقط") || normType.includes("oneway_in");
      const hotelCity = isOneWayIn ? "Buraydah" : "Jeddah";
      const btnLabel = isOneWayIn ? "🏨 فنادق القصيم" : "🏨 فنادق جدة";

      const url = `https://search.hotellook.com/?destination=${hotelCity}&checkIn=${checkIn}&checkOut=${checkOut}&marker=${TRAVELPAYOUTS_MARKER}&language=ar&currency=SAR`;
      return { url, btnLabel };
    }

    function saveUserPreferences(pax, bags) {
      try {
        localStorage.setItem('qassim_radar_pax', String(pax));
        localStorage.setItem('qassim_radar_bags', String(bags));
      } catch(e) {}
    }

    function loadUserPreferences() {
      try {
        const savedPax = localStorage.getItem('qassim_radar_pax');
        const savedBags = localStorage.getItem('qassim_radar_bags');
        if (savedPax) {
          const paxEl = document.getElementById('paxSlider');
          const paxValEl = document.getElementById('paxValue');
          if (paxEl) paxEl.value = savedPax;
          if (paxValEl) paxValEl.innerText = savedPax;
        }
        if (savedBags) {
          const bagEl = document.getElementById('bagSlider');
          const bagValEl = document.getElementById('bagValue');
          if (bagEl) bagEl.value = savedBags;
          if (bagValEl) bagValEl.innerText = savedBags;
        }
      } catch(e) {}
    }

    function loadCachedData() {
      try {
        const cached = localStorage.getItem('qassim_radar_cache');
        if (cached) {
          const parsed = JSON.parse(cached);
          if (parsed && Array.isArray(parsed.flights) && parsed.flights.length > 0) {
            processData(parsed, true);
          }
        }
      } catch (e) {
        console.warn("فشل قراءة الذاكرة المؤقتة:", e);
      }
    }

    function processData(data, isFromCache = false) {
      if (!isFromCache && (!data || !Array.isArray(data.flights) || data.flights.length === 0)) {
        if (rawFlights.length > 0) return;
      }

      marketStats = data.stats || { avg_price: 0, min_price: 0, total: 0 };
      rawFlights = [];

      rawFlights = (data.flights || []).map(item => {
        const price = parsePrice(item["السعر"] || item.price);
        let score = parsePrice(item["مؤشر_الثقة"] || item.score);
        let rec = item["توصية_القرار"] || item.recommendation || "راقب السعر";
        let forecast = item["توقعات_7_أيام"] || item.forecast || "السعر ضمن النطاق الطبيعي.";
        let level = item["مستوى_الثقة"] || item.level || "medium";

        if (!score || score <= 0) {
          if (price <= 358) {
            score = 96; rec = "احجز فوراً (قاع تاريخي)";
            forecast = "السعر في القاع الترويجي الأدنى."; level = "high";
          } else if (price <= 420) {
            score = 87; rec = "سعر اقتصادي ممتاز";
            forecast = "سعر مناسب جداً داخل نافذة الشراء الآمنة."; level = "high";
          } else if (price <= 550) {
            score = 65; rec = "سعر متوسط";
            forecast = "إمكانية طرح مقاعد مخفضة لاحقاً."; level = "medium";
          } else {
            score = 30; rec = "سعر متضخم";
            forecast = "المقاعد الاقتصادية غير متوفرة حالياً."; level = "low";
          }
        }
        score = Math.max(10, Math.min(99, score));

        const depVal = item["تاريخ الذهاب"] || item.dep || "";
        let timeVal = item["وقت الإقلاع"] || item.time || item.time_ar || "";
        if (!timeVal && typeof depVal === 'string') {
          const tm = depVal.match(/\((.*?)\)/);
          if (tm) timeVal = tm[1].trim();
        }

        const retVal = item["تاريخ العودة"] || item.ret || "";
        const airlineVal = item["الناقل"] || item.airline || "رحلة مباشرة";
        const tripTypeVal = item["نوع العطلة"] || item.trip_type || "رحلة مباشرة";

        return {
          trip_type: tripTypeVal,
          dep: depVal,
          time: timeVal,
          ret: retVal,
          airline: airlineVal,
          price: price,
          link: buildDirectAirlineUrl(airlineVal, depVal, retVal, tripTypeVal),
          score: score,
          recommendation: rec,
          forecast: forecast,
          level: level
        };
      });

      const updateLabel = document.getElementById('lastUpdateText');
      if (updateLabel) {
        if (isFromCache) {
          updateLabel.innerText = "بيانات محفوظة: " + (data.updated_at || "مسبقاً");
        } else {
          updateLabel.innerText = "آخر فحص حي: " + (data.updated_at || "الآن");
          try {
            localStorage.setItem('qassim_radar_cache', JSON.stringify(data));
          } catch(e) {}
        }
      }

      isInitialLoading = false;
      updateStats();
      renderFlights();
    }

    async function fetchLatestData(forceRefresh = false) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 9000);

      try {
        const res = await fetch('./flights_data.json?v=' + Date.now(), { 
          cache: 'no-store',
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error("تعذر جلب البيانات السحابية");
        const data = await res.json();
        processData(data, false);
      } catch (err) {
        clearTimeout(timeoutId);
        console.error("خطأ في جلب البيانات:", err);
        const updateLabel = document.getElementById('lastUpdateText');
        if (updateLabel) {
          if (rawFlights.length === 0) {
            updateLabel.innerText = "⚠️ تعذر قراءة البيانات السحابية";
            const container = document.getElementById('flightsList');
            if (container) {
              container.innerHTML = `
                <div class="bg-slate-800/40 border border-rose-900/40 rounded-2xl p-6 text-center text-slate-400 space-y-2">
                  <div class="text-rose-400 font-bold">⚠️ تعذر مزامنة الرحلات الحية</div>
                  <div class="text-xs">تأكد من اتصالك بالإنترنت أو أعد المحاولة لاحقاً.</div>
                </div>`;
            }
          } else {
            const baseText = updateLabel.innerText.replace(/\s*\(وضع عدم الاتصال ⚠️\)/g, '');
            updateLabel.innerText = baseText + " (وضع عدم الاتصال ⚠️)";
          }
        }
      } finally {
        isInitialLoading = false;
      }
    }

    function updateStats() {
      const validFlights = rawFlights.filter(f => f.price > 0);
      if (validFlights.length === 0) return;
      const sortedByPrice = [...validFlights].sort((a, b) => a.price - b.price);
      const lowest = sortedByPrice[0];

      const statLowestPriceEl = document.getElementById('statLowestPrice');
      const statLowestAirlineEl = document.getElementById('statLowestAirline');
      const statAvgPriceEl = document.getElementById('statAvgPrice');
      const badgeEl = document.getElementById('statDecisionBadge');
      const subEl = document.getElementById('statDecisionSub');

      if (statLowestPriceEl) statLowestPriceEl.innerText = lowest.price;
      if (statLowestAirlineEl) statLowestAirlineEl.innerText = getAirlineShortName(lowest.airline);

      const avg = marketStats.avg_price || Math.round(validFlights.reduce((acc, cur) => acc + cur.price, 0) / validFlights.length);
      if (statAvgPriceEl) statAvgPriceEl.innerText = avg;

      const highestScoreItem = [...validFlights].sort((a, b) => b.score - a.score)[0];
      if (badgeEl && highestScoreItem) {
        const scoreColor = highestScoreItem.score >= 85 ? 'text-emerald-400' : (highestScoreItem.score >= 60 ? 'text-amber-400' : 'text-rose-400');
        badgeEl.innerHTML = `<span class="${scoreColor} font-bold">${highestScoreItem.score}%</span>`;
      }
      if (subEl && highestScoreItem) {
        subEl.innerText = `${highestScoreItem.recommendation}`;
      }
    }

    function setFilter(type) {
      triggerHaptic('selection_changed');
      activeFilter = type;

      // تفعيل زر الرجوع الأصلي لتيليجرام
      if (tg && tg.BackButton) {
        if (activeFilter !== 'all') {
          tg.BackButton.show();
          tg.BackButton.onClick(() => setFilter('all'));
        } else {
          tg.BackButton.hide();
        }
      }

      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-500');
        b.classList.add('bg-slate-800', 'text-slate-300', 'border-slate-700');
      });
      const activeBtn = document.getElementById('filter-' + type);
      if (activeBtn) {
        activeBtn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-500');
        activeBtn.classList.remove('bg-slate-800', 'text-slate-300', 'border-slate-700');
      }
      if (!isInitialLoading) {
        renderFlights();
      }
    }

    function renderFlights() {
      const container = document.getElementById('flightsList');
      if (!container) return;
      container.innerHTML = "";

      if (isInitialLoading && rawFlights.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-800/50 border border-slate-700/40 rounded-2xl p-6 text-center text-slate-400">
            جاري تحميل وتجهيز مسارات الأسعار...
          </div>`;
        return;
      }

      const paxInput = document.getElementById('paxSlider');
      const bagInput = document.getElementById('bagSlider');
      const pax = paxInput ? (parseInt(paxInput.value, 10) || 1) : 1;
      const bags = bagInput ? (parseInt(bagInput.value, 10) || 0) : 0;

      let filtered = rawFlights.filter(x => x.price > 0);

      if (activeFilter === 'deals') {
        filtered = filtered.filter(x => {
          const isOne = !cleanDate(x.ret);
          return isOne ? (x.price <= 210) : (x.price <= 390);
        });
      } else if (activeFilter === 'high_confidence') {
        filtered = filtered.filter(x => x.score >= 85);
      } else if (activeFilter === 'adeal') {
        filtered = filtered.filter(x => normalizeArabic(x.airline).includes("اديل"));
      } else if (activeFilter === 'saudia') {
        filtered = filtered.filter(x => normalizeArabic(x.airline).includes("السعوديه"));
      } else if (activeFilter === 'nas') {
        filtered = filtered.filter(x => normalizeArabic(x.airline).includes("ناس"));
      } else if (activeFilter === 'combo') {
        filtered = filtered.filter(x => normalizeArabic(x.airline).includes("دمج ذكي"));
      }

      filtered.sort((a, b) => a.price - b.price);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-6 text-center text-slate-400">
            ℹ️ لا توجد رحلات مطابقة للفلاتر الحالية.
          </div>`;
        return;
      }

      const marketAvg = marketStats.avg_price || 420;
      const fragment = document.createDocumentFragment();

      filtered.forEach(item => {
        const retDateClean = cleanDate(item.ret);
        const isOneWay = !retDateClean;
        const bagFee = calculateBaggageFee(item.airline, isOneWay, bags);
        const finalPrice = Math.round((item.price * pax) + bagFee);

        let barColor = "bg-rose-500";
        let badgeBg = "bg-rose-950 text-rose-300 border-rose-800/60";
        if (item.score >= 85) {
          barColor = "bg-emerald-500";
          badgeBg = "bg-emerald-950 text-emerald-300 border-emerald-800/60";
        } else if (item.score >= 60) {
          barColor = "bg-amber-500";
          badgeBg = "bg-amber-950 text-amber-300 border-amber-800/60";
        }

        const normAir = normalizeArabic(item.airline);
        let airlineColor = "bg-indigo-950 text-indigo-400 border-indigo-800/60";
        if (normAir.includes("دمج ذكي")) {
          airlineColor = "bg-purple-950 text-purple-300 border-purple-800/60";
        } else if (normAir.includes("اديل")) {
          airlineColor = "bg-emerald-950 text-emerald-400 border-emerald-800/60";
        } else if (normAir.includes("ناس")) {
          airlineColor = "bg-amber-950 text-amber-400 border-amber-800/60";
        } else if (normAir.includes("السعوديه")) {
          airlineColor = "bg-blue-950 text-blue-300 border-blue-800/60";
        }

        const cleanDep = cleanDate(item.dep);
        const depDisplay = cleanDep || String(item.dep || "").replace(/\(.*?\)/g, "").trim();
        const timeDisplay = item.time ? ` (${escapeHtml(item.time)})` : "";

        const returnHtml = isOneWay ? 
          `<div class="text-xs text-indigo-400 font-bold mt-0.5">🛫 اتجاه واحد فقط</div>` : 
          `<div class="text-xs text-slate-400 mt-0.5">عودة: <code>${escapeHtml(retDateClean)}</code></div>`;

        let savingBadge = "";
        const benchmarkPrice = isOneWay ? (marketAvg / 2) : marketAvg;
        if (item.price < benchmarkPrice && benchmarkPrice > 0 && item.price > 0) {
          const discountPct = Math.min(90, Math.max(5, Math.round(((benchmarkPrice - item.price) / benchmarkPrice) * 100)));
          if (discountPct >= 10) {
            savingBadge = `<span class="text-[10px] font-extrabold text-emerald-400 bg-emerald-950/80 px-1.5 py-0.5 rounded border border-emerald-700/60">وفر ${discountPct}%</span>`;
          }
        }

        // تفصيل الأمتعة لحظر ارتباك المسافر عند اختيار حقائب مع الخطوط السعودية
        const isSaudia = normAir.includes("السعوديه") && !normAir.includes("دمج ذكي");
        let bagStatusHtml = "";
        if (bags > 0) {
          if (isSaudia) {
            bagStatusHtml = `<span class="text-[10px] text-emerald-400 block font-bold">شحن 23kg مجاني 🎁</span>`;
          } else {
            bagStatusHtml = `<span class="text-[10px] text-slate-400 block font-medium">+${bagFee} ر.س (${bags} حقيبة)</span>`;
          }
        }

        const directLink = buildDirectAirlineUrl(item.airline, item.dep, item.ret, item.trip_type);
        const hotelInfo = buildHotelInfo(item.dep, item.ret, item.trip_type);
        const shortName = getAirlineShortName(item.airline);

        const card = document.createElement('div');
        card.className = "bg-slate-800/70 border border-slate-700/70 rounded-2xl p-4 shadow-lg space-y-3";

        card.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-700/50 pb-2.5">
            <div class="flex items-center gap-1.5">
              <span class="px-2.5 py-0.5 rounded-lg text-xs font-bold border ${airlineColor}">
                ✈️ ${escapeHtml(item.airline)}
              </span>
              ${savingBadge}
            </div>
            <span class="text-xs text-slate-400 font-medium">${escapeHtml(item.trip_type)}</span>
          </div>

          <div class="flex items-center justify-between">
            <div>
              <div class="text-xs text-slate-400">مواعيد السفر</div>
              <div class="text-sm font-bold text-white mt-0.5">
                ذهاب: <code>${escapeHtml(depDisplay)}</code>${timeDisplay}
              </div>
              ${returnHtml}
            </div>

            <div class="text-left">
              <span class="text-xs text-slate-400 block">${pax > 1 || bags > 0 ? 'التكلفة الإجمالية' : 'السعر'}</span>
              <span class="text-2xl font-black text-white">${finalPrice}</span>
              <span class="text-xs text-slate-300">ر.س</span>
              ${bagStatusHtml}
            </div>
          </div>

          <!-- شريط الثقة والتنبؤ الاحتمالي -->
          <div class="bg-slate-900/60 border border-slate-700/50 rounded-xl p-2.5 space-y-2">
            <div class="flex items-center justify-between text-xs">
              <span class="text-slate-400 flex items-center gap-1">
                <span>🎯 مؤشر الشراء:</span>
                <b class="text-white">${item.score}%</b>
              </span>
              <span class="px-2 py-0.5 rounded-md text-[11px] font-bold border ${badgeBg}">
                ${escapeHtml(item.recommendation)}
              </span>
            </div>
            <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
              <div class="${barColor} h-1.5 rounded-full transition-all duration-500" style="width: ${Math.max(5, Math.min(100, item.score))}%"></div>
            </div>
            <p class="text-[11px] text-slate-400 leading-snug">
              🔮 <b>توقع المسار:</b> ${escapeHtml(item.forecast)}
            </p>
          </div>

          <!-- أزرار الإجراءات التفاعلية بنظام Event Delegation -->
          <div class="grid grid-cols-2 gap-2 pt-0.5">
            <button data-action-url="${escapeHtml(directLink)}" class="action-btn flex items-center justify-center gap-1 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-xs font-bold py-2.5 rounded-xl transition shadow-md">
              <span>حجز مباشر (${escapeHtml(shortName)})</span>
              <span>↗</span>
            </button>
            <button data-action-url="${escapeHtml(hotelInfo.url)}" class="action-btn flex items-center justify-center gap-1 bg-slate-700 hover:bg-slate-600 active:scale-95 text-slate-200 text-xs font-bold py-2.5 rounded-xl border border-slate-600 transition">
              <span>${escapeHtml(hotelInfo.btnLabel)}</span>
              <span>↗</span>
            </button>
          </div>
        `;

        fragment.appendChild(card);
      });

      container.appendChild(fragment);
    }

    // تفعيل مستمع الأحداث المركزي مرة واحدة
    const flightsContainer = document.getElementById('flightsList');
    if (flightsContainer) {
      flightsContainer.addEventListener('click', (e) => {
        const actionBtn = e.target.closest('[data-action-url]');
        if (actionBtn) {
          const targetUrl = actionBtn.getAttribute('data-action-url');
          if (targetUrl) openBookingUrl(targetUrl);
        }
      });
    }

    // بدء التشغيل: تحميل التفضيلات، استعراض الكاش فوراً، ثم المزامنة الحية في الخلفية
    loadUserPreferences();
    loadCachedData();
    fetchLatestData();
  </script>
</body>
</html>
